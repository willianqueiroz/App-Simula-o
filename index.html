<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operador de Crédito Senna Motors</title>
<meta name="description" content="Descubra quanto libera pra você em minutos.">
<meta name="theme-color" content="#0b0b0d">
<meta property="og:title" content="Operador de Crédito Senna Motors">
<meta property="og:description" content="Descubra quanto libera pra você em minutos.">
<meta property="og:image" content="/banner.jpg">
<style>
  :root { --bg:#0b0b0d; --card:#141417; --card2:#1c1c21; --ink:#f4f4f6; --muted:#a2a2ad; --brand:#e10600; --brand2:#ff2a1f; --line:#2c2c33; --ok:#2ecc8f; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  .banner { width:100%; display:block; aspect-ratio:1672/941; object-fit:cover; max-height:420px; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px 44px; }
  .head { text-align:center; padding:22px 0 18px; }
  .kicker { display:inline-block; font-size:12px; letter-spacing:.18em; font-weight:800; color:var(--brand2); text-transform:uppercase; }
  h1 { font-size:26px; line-height:1.15; margin:8px 0 8px; text-transform:uppercase; letter-spacing:.02em; }
  h1 span { color:var(--brand2); }
  p.sub { margin:0; color:var(--muted); font-size:17px; }
  p.sub b { color:var(--ink); }
  form { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--brand); border-radius:14px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.45); }
  label { display:block; font-weight:600; font-size:14px; margin:16px 0 6px; }
  label:first-of-type { margin-top:0; }
  input, select { width:100%; padding:13px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--card2); color:var(--ink); }
  input::placeholder { color:#6d6d78; }
  input:focus, select:focus { outline:2px solid var(--brand); border-color:transparent; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:18px; font-size:13px; color:var(--muted); }
  .check input { width:auto; margin-top:2px; accent-color:var(--brand); }
  button { width:100%; margin-top:20px; padding:15px; font-size:17px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:#fff; background:linear-gradient(180deg,var(--brand2),var(--brand)); border:0; border-radius:10px; cursor:pointer; box-shadow:0 6px 18px rgba(225,6,0,.35); }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:14px; padding:12px; border-radius:10px; font-size:15px; display:none; }
  .msg.ok { display:block; background:rgba(46,204,143,.12); color:var(--ok); border:1px solid rgba(46,204,143,.35); }
  .msg.err { display:block; background:rgba(255,107,107,.1); color:var(--err); border:1px solid rgba(255,107,107,.35); }
  .foot { text-align:center; color:#6d6d78; font-size:12px; margin-top:18px; }
  .hp { position:absolute; left:-9999px; }
</style>
</head>
<body>
<img class="banner" src="banner.jpg" alt="Senna Motors" fetchpriority="high">
<div class="wrap">
  <div class="head">
    <span class="kicker">Senna Motors</span>
    <h1>Operador de Crédito <span>Senna Motors</span></h1>
    <p class="sub"><b>Descubra quanto libera pra você em minutos.</b></p>
  </div>

  <form id="f" novalidate>
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" autocomplete="name" required>

    <div class="row">
      <div>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required>
      </div>
      <div>
        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="date" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="entrada">Entrada (R$)</label>
        <input id="entrada" name="entrada" inputmode="numeric" placeholder="R$ 0,00" required>
      </div>
      <div>
        <label for="parcela">Parcela que cabe (R$)</label>
        <input id="parcela" name="parcela" inputmode="numeric" placeholder="R$ 0,00" required>
      </div>
    </div>

    <label for="whatsapp">Seu WhatsApp</label>
    <input id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" placeholder="(61) 90000-0000" autocomplete="tel" required>

    <label for="prazo">Quando pretende comprar?</label>
    <select id="prazo" name="prazo" required>
      <option value="">Selecione</option>
      <option>O quanto antes</option>
      <option>Em até 15 dias</option>
      <option>Em até 30 dias</option>
      <option>Mais de 30 dias</option>
    </select>

    <div class="row">
      <div>
        <label for="restricao">Restrição no nome?</label>
        <select id="restricao" name="restricao" required>
          <option value="">Selecione</option>
          <option>Não</option>
          <option>Sim</option>
          <option>Não sei</option>
        </select>
      </div>
      <div>
        <label for="cnh">Possui CNH?</label>
        <select id="cnh" name="cnh" required>
          <option value="">Selecione</option>
          <option>Sim</option>
          <option>Não</option>
        </select>
      </div>
    </div>

    <input class="hp" name="empresa" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="check">
      <input type="checkbox" id="consent" required>
      <label for="consent" style="font-weight:400;margin:0">Concordo que meus dados sejam usados pela Senna Motors para simulação de crédito e contato por WhatsApp (LGPD).</label>
    </div>

    <button id="btn" type="submit">Descobrir quanto libera</button>
    <div id="msg" class="msg" role="status"></div>
  </form>

  <div class="foot">Senna Motors · Seu crédito, sua chave na mão.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const digits = s => s.replace(/\D/g, '');

// Máscaras
$('cpf').addEventListener('input', e => {
  let v = digits(e.target.value).slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  e.target.value = v;
});
$('whatsapp').addEventListener('input', e => {
  let v = digits(e.target.value).slice(0, 11);
  if (v.length > 6) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
  else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
  e.target.value = v;
});
function moneyMask(e) {
  const n = digits(e.target.value);
  e.target.value = n ? (Number(n) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';
}
$('entrada').addEventListener('input', moneyMask);
$('parcela').addEventListener('input', moneyMask);

function cpfValido(c) {
  c = digits(c);
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += Number(c[i]) * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(c[t])) return false;
  }
  return true;
}

function show(type, text) {
  const m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = text;
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f).entries());

  if (d.nome.trim().split(/\s+/).length < 2) return show('err', 'Informe o nome completo.');
  if (!cpfValido(d.cpf)) return show('err', 'CPF inválido.');
  if (!d.nascimento) return show('err', 'Informe a data de nascimento.');
  if (!d.entrada || !d.parcela) return show('err', 'Informe a entrada e a parcela.');
  if (digits(d.whatsapp).length < 10) return show('err', 'WhatsApp inválido.');
  if (!d.prazo || !d.restricao || !d.cnh) return show('err', 'Preencha todos os campos.');
  if (!$('consent').checked) return show('err', 'É necessário aceitar o termo para continuar.');

  const btn = $('btn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const r = await fetch('/api/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(d)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Erro ao enviar.');
    f.reset();
    show('ok', 'Recebemos seus dados! Em instantes um operador da Senna Motors chama você no WhatsApp.');
  } catch (err) {
    show('err', err.message || 'Não foi possível enviar. Tente novamente.');
  } finally {
    btn.disabled = false; btn.textContent = 'Descobrir quanto libera';
  }
});
</script>
</body>
</html>
